server {
  listen 80;

  location = /runtime-config.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
