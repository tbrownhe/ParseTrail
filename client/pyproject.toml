[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parsetrail"
description = "ParseTrail Desktop Client"
readme = "README.md"
authors = [{ name = "Tobias Brown-Heft" }]

requires-python = ">=3.13,<3.14"
dependencies = [
  "PySide6-Essentials==6.11.2",
  "pyinstaller<7.0,>=6.17",
  "loguru<1.0,>=0.7",
  "openpyxl<4.0,>=3.1",
  "pandas<3.0,>=2.3",
  "matplotlib<4.0,>=3.10",
  "scikit-learn==1.7.2",
  "seaborn<1.0.0,>=0.13.0",
  "SQLAlchemy<3.0.0,>=2.0.0",
  "alembic<2.0.0,>=1.12.1",
  "pdfplumber==0.11.10",
  "requests<3,>=2.32",
  "pydantic<3,>=2.10",
  "pydantic-settings<3,>=2.7",
  "cryptography<50.0.0,>=48.0.1",
  "psycopg[binary]<4.0.0,>=3.1.13",
  "mkl; sys_platform == 'win32'",
]
dynamic = ["version"]

[tool.hatch.version]
path = "src/parsetrail/version.py"

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parsetrail"]
include = ["src/parsetrail/assets/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
