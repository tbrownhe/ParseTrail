name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python 3.13 / PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: parsetrail_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: parsetrail-test-only
        ports:
          - 64321:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parsetrail_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --extra dev --frozen
        working-directory: backend
      - name: Run migrations and tests
        run: uv run --frozen bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - name: Store coverage report
        if: ${{ always() && hashFiles('backend/htmlcov/**') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage-html
          path: backend/htmlcov
          include-hidden-files: true

  client:
    name: Client / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --extra dev --frozen --python 3.13.15
        working-directory: client
      - name: Run client tests
        run: uv run --frozen --python 3.13.15 pytest -q
        working-directory: client

  frontend:
    name: Frontend / Node 22
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: frontend
      - name: Check formatting and lint
        run: npm run lint:check
        working-directory: frontend
      - name: Test public website JavaScript
        run: npm run test:website
        working-directory: frontend
      - name: Build production bundle
        run: npm run build
        working-directory: frontend

  deployment-tools:
    name: Deployment tooling / offline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - name: Run offline deployment tests
        run: python -m unittest discover -s scripts/deployment -p "test_*.py" -v
